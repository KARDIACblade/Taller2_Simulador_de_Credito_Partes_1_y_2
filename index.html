<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito | BANCO PIONERO </title>
    <link rel="stylesheet" href="simulador.css">
    <script src="funciones.js"></script>
    <script src="simulador.js"></script>

</head>
<body>

    <header class="encabezado">
        <div class="encabezado__interior">
            <!-- Logo simplificado en SVG. Reemplázalo por el logo oficial si lo necesitas. -->
            <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Logo Banco PIONERO" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="30" fill="#FFDD00"/>
                <path d="M32 8 L54 20 V34 C54 45 44 53 32 57 C20 53 10 45 10 34 V20 Z" fill="#002D72"/>
                <path d="M23 44 V20 H35 C42 20 45 24 45 29 C45 34 42 38 35 38 H29 V44 Z M29 25 V33 H34 C37 33 39 31.500 39 29 C39 26.500 37 25 34 25 Z" fill="#FFDD00" fill-rule="evenodd"/>
            </svg>
            <span class="marca">Banco PIONERO</span>
        </div>
    </header>

    <main class="container">
        <h1>Simulador de Crédito</h1>
        <p class="intro">Ingresa tus datos y conoce si tu crédito puede ser aprobado.</p>

        <div class="paneles">

            <section class="tarjeta">
                <h2>Datos financieros</h2>

                <label for="txtIngresos">Ingresos:</label>
                <input type="text" id="txtIngresos" inputmode="decimal" autocomplete="off" placeholder="Ej. 1000">

                <label for="txtEgresos">Egresos:</label>
                <input type="text" id="txtEgresos" inputmode="decimal" autocomplete="off" placeholder="Ej. 600">

                <p class="resultado">Disponible: <span id="spnDisponible"></span></p>
                <p class="resultado">Capacidad de pago mensual: <span id="spnCapacidadPago"></span></p>
            </section>

            <section class="tarjeta">
                <h2>Solicitud de crédito</h2>

                <label for="txtMonto">Monto:</label>
                <input type="text" id="txtMonto" inputmode="numeric" autocomplete="off" placeholder="Ej. 2000">

                <label for="txtPlazo">Plazo en años:</label>
                <input type="text" id="txtPlazo" inputmode="numeric" autocomplete="off" placeholder="Ej. 1">

                <label for="txtTasaInteres">Tasa de interés:</label>
                <input type="text" id="txtTasaInteres" inputmode="numeric" autocomplete="off" placeholder="Ej. 10">

                <p class="resultado">Interés a pagar: <span id="spnInteresPagar"></span></p>
                <p class="resultado">Total préstamo: <span id="spnTotalPrestamo"></span></p>
                <p class="resultado">Cuota mensual: <span id="spnCuotaMensual"></span></p>
                <p class="estado">Estado de crédito: <span id="spnEstadoCredito">ANALIZANDO...</span></p>
            </section>

        </div>

        <div class="buttons">
            <button id="btnCalcularCredito" class="btn-principal" onclick="calcular()">Calcular Crédito</button>
            <button id="btnReiniciar" class="btn-secundario" onclick="reiniciar()">Reiniciar</button>
        </div>
    </main>

</body>
</html>
